[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "intelflowlm"
version = "0.1.0"
description = "iNPU: Ultra-efficient Intel NPU inference engine, CLI, dual OpenAI/Ollama server, and agent toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "iNPU Community"}
]
dependencies = [
    "openvino>=2025.0.0",
    "openvino-genai>=2025.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "mcp>=1.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "huggingface-hub>=0.20.0",
    "httpx>=0.27.0",
    "numpy>=1.24.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
inpu = "intelflow.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["intelflow*"]
